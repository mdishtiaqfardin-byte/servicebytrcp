<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRCP AGENCY - Dual-Portal Booking & Management</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // --- APP STATE ---
      let currentPortal = 'client'; // 'client' or 'admin'
      let isAdminLoggedIn = false;
      let activeTab = 'home';
      let activeAdminTab = 'dashboard';

      // IndexedDB Helper for Collections
      const DB_NAME = 'TRCP_DB';
      const STORE_NAME = 'collections_store';
      const DB_VERSION = 1;

      function openDB() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(DB_NAME, DB_VERSION);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
              db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
          };
          request.onsuccess = (e) => resolve(e.target.result);
          request.onerror = (e) => reject(e.target.error);
        });
      }

      async function saveCollectionsToDB(collectionsArray) {
        try {
          const db = await openDB();
          const tx = db.transaction(STORE_NAME, 'readwrite');
          const store = tx.objectStore(STORE_NAME);
          store.clear(); // sync clear
          collectionsArray.forEach(item => store.put(item));
          return new Promise((resolve, reject) => {
            tx.oncomplete = () => resolve();
            tx.onerror = (e) => reject(e.target.error);
          });
        } catch (err) {
          console.error("Failed to save collections to IndexedDB:", err);
        }
      }

      async function loadCollectionsFromDB() {
        try {
          const db = await openDB();
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const request = store.getAll();
          return new Promise((resolve, reject) => {
            request.onsuccess = () => resolve(request.result);
            request.onerror = (e) => reject(e.target.error);
          });
        } catch (err) {
          console.error("Failed to load collections from IndexedDB:", err);
          return [];
        }
      }

      // Utility to compress image files to prevent bloated Base64 strings
      function compressImage(file, maxWidth = 800, maxHeight = 800, quality = 0.7) {
        return new Promise((resolve, reject) => {
          if (!file.type.startsWith('image/')) {
            // If it's a video or non-image, fallback to standard FileReader
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = (e) => reject(e);
            reader.readAsDataURL(file);
            return;
          }
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              let width = img.width;
              let height = img.height;

              if (width > height) {
                if (width > maxWidth) {
                  height = Math.round((height * maxWidth) / width);
                  width = maxWidth;
                }
              } else {
                if (height > maxHeight) {
                  width = Math.round((width * maxHeight) / height);
                  height = maxHeight;
                }
              }

              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = (err) => reject(err);
            img.src = event.target.result;
          };
          reader.onerror = (err) => reject(err);
          reader.readAsDataURL(file);
        });
      }

      // Initial Default Data
      let collections = [];
      let defaultCollections = [
        { id: '1', name: 'Nusrat Jahan', age: 22, code: 'TRCP-101', rate: 3500, city: 'Dhaka', cover: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500', photos: [], videos: [], desc: 'Available for premium service.' },
        { id: '2', name: 'Sultana Razia', age: 24, code: 'TRCP-102', rate: 4500, city: 'Chittagong', cover: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=500', photos: [], videos: [], desc: 'Professional model and escort.' },
        { id: '3', name: 'Anika Rahman', age: 21, code: 'TRCP-103', rate: 3000, city: 'Sylhet', cover: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500', photos: [], videos: [], desc: 'Friendly and discreet.' }
      ];

      // Async Initialization for DB persistence
      async function initStorage() {
        const storedDB = await loadCollectionsFromDB();
        if (storedDB && storedDB.length > 0) {
          collections = storedDB;
        } else {
          // Fallback to initial local storage check or default array
          const legacyStorage = localStorage.getItem('trcp_collections');
          if (legacyStorage) {
            try {
              collections = JSON.parse(legacyStorage);
            } catch(e) {
              collections = defaultCollections;
            }
          } else {
            collections = defaultCollections;
          }
          await saveCollectionsToDB(collections);
        }
        renderApp();
      }

      async function syncCollections() {
        await saveCollectionsToDB(collections);
        // Also update legacy key as fallback if lightweight
        try {
          localStorage.setItem('trcp_collections', JSON.stringify(collections.slice(0, 10)));
        } catch(e) { /* ignore fallback errors */ }
      }
      // Handle Collection Add / Edit submission
      async function handleSaveCollection(e) {
        e.preventDefault();
        const id = document.getElementById('coll-id').value;
        const name = document.getElementById('coll-name').value;
        const code = document.getElementById('coll-code').value;
        const age = document.getElementById('coll-age').value;
        const city = document.getElementById('coll-city').value;
        const rate = document.getElementById('coll-rate').value;
        const desc = document.getElementById('coll-desc').value;
        const coverFileInput = document.getElementById('coll-cover-file');
        const mediaFilesInput = document.getElementById('coll-media-files');

        let coverUrl = document.getElementById('coll-cover-url-preview').value || 'https://placehold.co/400x500?text=No+Cover';

        if (coverFileInput.files && coverFileInput.files[0]) {
          coverUrl = await compressImage(coverFileInput.files[0]);
        }

        let mediaPhotos = [];
        let mediaVideos = [];

        if (mediaFilesInput.files && mediaFilesInput.files.length > 0) {
          for (let i = 0; i < mediaFilesInput.files.length; i++) {
            const file = mediaFilesInput.files[i];
            const dataUrl = await compressImage(file);
            if (file.type.startsWith('video/')) {
              mediaVideos.push(dataUrl);
            } else {
              mediaPhotos.push(dataUrl);
            }
          }
        }

        if (id) {
          // Edit existing
          const idx = collections.findIndex(c => c.id === id);
          if (idx !== -1) {
            collections[idx] = {
              ...collections[idx],
              name, code, age: parseInt(age), city, rate: parseInt(rate), desc,
              cover: coverUrl.startsWith('data:') ? coverUrl : (collections[idx].cover || coverUrl),
              photos: mediaPhotos.length > 0 ? [...collections[idx].photos, ...mediaPhotos] : collections[idx].photos,
              videos: mediaVideos.length > 0 ? [...collections[idx].videos, ...mediaVideos] : collections[idx].videos
            };
          }
        } else {
          // Add new item
          const newColl = {
            id: Date.now().toString(),
            name,
            code,
            age: parseInt(age),
            city,
            rate: parseInt(rate),
            desc,
            cover: coverUrl,
            photos: mediaPhotos,
            videos: mediaVideos
          };
          collections.push(newColl);
        }

        await syncCollections();
        closeModal();
        renderApp();
      }

      async function deleteCollection(id) {
        if (confirm("Are you sure you want to delete this collection profile?")) {
          collections = collections.filter(c => c.id !== id);
          await syncCollections();
          renderApp();
        }
      }

      window.onload = function() {
        initStorage();
      };
    </script>

                users: [
                    { name: 'Demo Client', phone: '01700000000', password: '1234', isBanned: false }
                ],

                // Payment Draft & Modal
                showPaymentModal: false,
                activeBookingDraft: {},
                paymentForm: {
                    type: 'Send Money', // Send Money / Cash In
                    gateway: 'bKash',
                    proofImage: '',
                    last4: ''
                },

                // Gallery Modal State
                showGalleryModal: false,
                selectedGalleryProfile: null,
                galleryActiveIndex: 0,

                showCollectionModal: false,
                collectionForm: {
                    id: null,

                initApp() {
                    this.generateDatesWindow();
                    this.loadStoredData();
                    this.seedInitialCollections();
                    this.onRealMainAreaChange();
                },

                generateDatesWindow() {
                    const dates = [];
                    const today = new Date();
                    for (let i = 0; i < 10; i++) {
                        const d = new Date(today);
                        d.setDate(today.getDate() + i);
                        const dateStr = d.toISOString().split('T')[0];
                        dates.push(dateStr);
                    }
                    this.availableDatesWindow = dates;
                    this.realServiceFlow.date = dates[0];
                    this.adminScheduleDate = dates[0];
                },

                toggleLang() {
                    this.lang = this.lang === 'bn' ? 'en' : 'bn';
                },

                // DATA PERSISTENCE
                loadStoredData() {
                    const storedUsers = localStorage.getItem('trcp_users');
                    if (storedUsers) this.users = JSON.parse(storedUsers);

                    const storedCollections = localStorage.getItem('trcp_collections');
                    if (storedCollections) this.collections = JSON.parse(storedCollections);

                    const storedBookings = localStorage.getItem('trcp_bookings');
                    if (storedBookings) this.bookings = JSON.parse(storedBookings);

                    const storedSchedule = localStorage.getItem('trcp_schedule');
                    if (storedSchedule) this.scheduleMatrix = JSON.parse(storedSchedule);

                    const storedNumbers = localStorage.getItem('trcp_numbers');
                    if (storedNumbers) this.paymentNumbers = JSON.parse(storedNumbers);
                },

                saveData() {
                    localStorage.setItem('trcp_users', JSON.stringify(this.users));
                    localStorage.setItem('trcp_collections', JSON.stringify(this.collections));
                    localStorage.setItem('trcp_bookings', JSON.stringify(this.bookings));
                    localStorage.setItem('trcp_schedule', JSON.stringify(this.scheduleMatrix));
                    localStorage.setItem('trcp_numbers', JSON.stringify(this.paymentNumbers));
                },

                seedInitialCollections() {
                    if (this.collections.length === 0) {
                        const sampleGallery = [
                            'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80',
                            'https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80'
                        ];

                        this.collections = [
                            { id: 1, name: 'Sumi Khan', code: '01', category: 'Medium', videoAvailable: true, gallery: sampleGallery },
                            { id: 2, name: 'Nadia Ahmed', code: '02', category: 'Medium', videoAvailable: true, gallery: sampleGallery },
                            { id: 3, name: 'Riya Chowdhury', code: '03', category: 'Medium', videoAvailable: false, gallery: sampleGallery },
                            { id: 4, name: 'Priya Roy', code: '101', category: 'Premium', videoAvailable: true, gallery: sampleGallery },
                            { id: 5, name: 'Tania Sheikh', code: '102', category: 'Premium', videoAvailable: true, gallery: sampleGallery },
                            { id: 6, name: 'Anika Rahman', code: '103', category: 'Premium', videoAvailable: false, gallery: sampleGallery },
                            { id: 7, name: 'Mitu Islam', code: '301', category: 'Special', videoAvailable: true, gallery: sampleGallery },
                            { id: 8, name: 'Farhana Yeasmin', code: '302', category: 'Special', videoAvailable: true, gallery: sampleGallery }
                        ];
                        this.autoBalanceMatrix();
                        this.saveData();
                    }
                },

                // AUTHENTICATION LOGIC
                openAuthModal(mode) {
                    this.authMode = mode;
                    this.showAuthModal = true;
                },

                handleClientAuth() {
                    if (this.authMode === 'register') {
                        const existing = this.users.find(u => u.phone === this.authForm.phone);
                        if (existing) {
                            alert('This phone number is already registered.');
                            return;
                        }
                        const newUser = {
                            name: this.authForm.name,
                            phone: this.authForm.phone,
                            password: this.authForm.password,
                            isBanned: false
                        };
                        this.users.push(newUser);
                        this.currentUser = newUser;
                        this.saveData();
                        this.showAuthModal = false;
                        alert('Registration successful!');
                    } else {
                        const user = this.users.find(u => u.phone === this.authForm.phone && u.password === this.authForm.password);
                        if (!user) {
                            alert('Invalid phone or password.');
                            return;
                        }
                        if (user.isBanned) {
                            alert('Your account is banned. Contact support/helpline.');
                            return;
                        }
                        this.currentUser = user;
                        this.showAuthModal = false;
                    }
                },

                logoutClient() {
                    this.currentUser = null;
                },

                // ADMIN AUTHENTICATION
                openAdminAuthModal() {
                    this.showAdminAuthModal = true;
                },

                handleAdminLogin() {
                    // Hidden Master Credentials Check
                    if (this.adminForm.phone === '01971355287' && this.adminForm.password === '181296') {
                        this.isAdminLoggedIn = true;
                        this.showAdminAuthModal = false;
                        this.adminForm = { phone: '', password: '' };
                    } else {
                        alert('Incorrect Admin Security Credentials.');
                    }
                },

                logoutAdmin() {
                    this.isAdminLoggedIn = false;
                },

                // REAL SERVICE FILTERS
                onRealMainAreaChange() {
                    this.filteredSubAreas = this.allSubAreas.filter(s => s.mainAreaId === this.realServiceFlow.mainAreaId);
                    if (this.filteredSubAreas.length > 0) {
                        this.realServiceFlow.subAreaId = this.filteredSubAreas[0].id;
                    } else {
                        this.realServiceFlow.subAreaId = '';
                    }
                },

                getAvailableProfilesForReal() {
                    const key = `${this.realServiceFlow.date}_${this.realServiceFlow.subAreaId}`;
                    const assignedCodes = this.scheduleMatrix[key] || [];
                    return this.collections.filter(p => assignedCodes.includes(p.code));
                },

                selectServiceType(type) {
                    this.currentTab = type;
                },

                // BOOKING FLOWS
                startBookingReal(profile) {
                    if (!this.currentUser) {
                        this.openAuthModal('login');
                        return;
                    }

                    // Standard Rates Hierarchy
                    let rates = { '1 Hour': 2000, '2 Hours': 3200, '3 Hours': 4500, 'Night': 6000 };
                    if (profile.category === 'Premium') {
                        rates = { '1 Hour': 3000, '2 Hours': 4200, '3 Hours': 5500, 'Night': 8000 };
                    } else if (profile.category === 'Special') {
                        rates = { '1 Hour': 2500, '2 Hours': 3800, '3 Hours': 5000, 'Night': 7000 };
                    }
                    if (profile.customRatesEnabled && profile.rates) {
                        rates = profile.rates;
                    }

                    const selectedDuration = '1 Hour';
                    const totalRate = rates[selectedDuration];
                    const advanceCalc = this.calculateAdvancePayment(totalRate);

                    this.activeBookingDraft = {
                        serviceType: 'real',
                        title: `Real Service - ${profile.name} (Code: ${profile.code})`,
                        details: `Date: ${this.realServiceFlow.date} | Duration: ${selectedDuration}`,
                        profileCode: profile.code,
                        totalRate: totalRate,
                        advancePaid: advanceCalc.advance,
                        remainingHandCash: advanceCalc.remaining
                    };

                    this.showPaymentModal = true;
                },

                startBookingVideo(profile) {
                    if (!this.currentUser) {
                        this.openAuthModal('login');
                        return;
                    }

                    const defaultRate = 750; // 10 mins Medium
                    const advanceCalc = this.calculateAdvancePayment(defaultRate);

                    this.activeBookingDraft = {
                        serviceType: 'video',
                        title: `Video Service - ${profile.name} (Code: ${profile.code})`,
                        details: `Duration: 10 Mins (Face + Fingering)`,
                        profileCode: profile.code,
                        totalRate: defaultRate,
                        advancePaid: advanceCalc.advance,
                        remainingHandCash: advanceCalc.remaining
                    };

                    this.showPaymentModal = true;
                },

                startBookingLive(packageName, price) {
                    if (!this.currentUser) {
                        this.openAuthModal('login');
                        return;
                    }

                    const advanceCalc = this.calculateAdvancePayment(price);

                    this.activeBookingDraft = {
                        serviceType: 'live',
                        title: `Live Show - ${packageName}`,
                        details: `Package: ${packageName}`,
                        totalRate: price,
                        advancePaid: advanceCalc.advance,
                        remainingHandCash: advanceCalc.remaining
                    };

                    this.showPaymentModal = true;
                },

                // ADVANCE PAYMENT CALCULATION RULE
                calculateAdvancePayment(totalRate) {
                    if (totalRate === 2000) {
                        const adv = 1000; // 50%
                        return { advance: adv, remaining: totalRate - adv };
                    } else if (totalRate > 2000) {
                        const adv = 1230; // Fixed 1230 BDT
                        return { advance: adv, remaining: totalRate - adv };
                    } else {
                        return { advance: totalRate, remaining: 0 }; // 100% Online
                    }
                },

                submitBookingPayment() {
                    const trx = this.paymentForm.type === 'Send Money' ? 'Screenshot Uploaded' : 'Last4: ' + this.paymentForm.last4;
                    const newBooking = {
                        id: 'TRCP' + Date.now(),
                        clientName: this.currentUser.name,
                        clientPhone: this.currentUser.phone,
                        serviceType: this.activeBookingDraft.serviceType,
                        details: `${this.activeBookingDraft.title} (${this.activeBookingDraft.details})`,
                        totalRate: this.activeBookingDraft.totalRate,
                        advancePaid: this.activeBookingDraft.advancePaid,
                        remainingHandCash: this.activeBookingDraft.remainingHandCash,
                        paymentMethod: `${this.paymentForm.gateway} (${this.paymentForm.type})`,
                        trxDetails: trx,
                        proofImage: this.paymentForm.proofImage,
                        status: 'Pending',
                        createdAt: new Date().toLocaleString()
                    };

                    this.bookings.unshift(newBooking);
                    this.saveData();
                    this.showPaymentModal = false;
                    alert('Payment Received. Please wait for Admin confirmation.');
                    this.currentTab = 'history';
                },

                getUserBookings() {
                    if (!this.currentUser) return [];
                    return this.bookings.filter(b => b.clientPhone === this.currentUser.phone);
                },

                // ADMIN ACTIONS
                approveBooking(id) {
                    const b = this.bookings.find(x => x.id === id);
                    if (b) b.status = 'Confirmed';
                    this.saveData();
                },

                deleteBooking(id) {
                    this.bookings = this.bookings.filter(x => x.id !== id);
                    this.saveData();
                },

                toggleBanUser(phone) {
                    const u = this.users.find(x => x.phone === phone);
                    if (u) {
                        u.isBanned = !u.isBanned;
                        this.saveData();
                    }
                },

                // AUTO-MATRIX DISTRIBUTION RULE
                autoBalanceMatrix() {
                    this.scheduleMatrix = {};
                    const dates = this.availableDatesWindow;
                    const mediumProfs = this.collections.filter(p => p.category === 'Medium');
                    const premiumProfs = this.collections.filter(p => p.category === 'Premium');
                    const specialProfs = this.collections.filter(p => p.category === 'Special');

                    dates.forEach(d => {
                        let usedCodesOnDate = new Set();

                        this.allSubAreas.forEach(sub => {
                            const assigned = [];

                            // Pick up to 3 Medium
                            mediumProfs.forEach(p => {
                                if (assigned.length < 3 && !usedCodesOnDate.has(p.code)) {
                                    assigned.push(p.code);
                                    usedCodesOnDate.add(p.code);
                                }
                            });

                            // Pick up to 3 Premium
                            let premCount = 0;
                            premiumProfs.forEach(p => {
                                if (premCount < 3 && !usedCodesOnDate.has(p.code)) {
                                    assigned.push(p.code);
                                    usedCodesOnDate.add(p.code);
                                    premCount++;
                                }
                            });

                            // Pick up to 2 Special
                            let specCount = 0;
                            specialProfs.forEach(p => {
                                if (specCount < 2 && !usedCodesOnDate.has(p.code)) {
                                    assigned.push(p.code);
                                    usedCodesOnDate.add(p.code);
                                    specCount++;
                                }
                            });

                            const key = `${d}_${sub.id}`;
                            this.scheduleMatrix[key] = assigned;
                        });
                    });

                    this.saveData();
                },

                isProfileScheduledHere(code, date, subAreaId) {
                    const key = `${date}_${subAreaId}`;
                    return (this.scheduleMatrix[key] || []).includes(code);
                },

                toggleProfileSchedule(code, date, subAreaId) {
                    // STRICT CHECK: Code cannot exist in other locations on same date
                    const targetKey = `${date}_${subAreaId}`;
                    const isAssigned = (this.scheduleMatrix[targetKey] || []).includes(code);

                    if (!isAssigned) {
                        // Remove from all other subAreas on this date first
                        this.allSubAreas.forEach(s => {
                            const k = `${date}_${s.id}`;
                            if (this.scheduleMatrix[k]) {
                                this.scheduleMatrix[k] = this.scheduleMatrix[k].filter(c => c !== code);
                            }
                        });

                        // Add to target
                        if (!this.scheduleMatrix[targetKey]) this.scheduleMatrix[targetKey] = [];
                        this.scheduleMatrix[targetKey].push(code);
                    } else {
                        // Remove
                        this.scheduleMatrix[targetKey] = this.scheduleMatrix[targetKey].filter(c => c !== code);
                    }

                    this.saveData();
                },

                toggleVideoAvailability(id) {
                    const p = this.collections.find(x => x.id === id);
                    if (p) {
                        p.videoAvailable = !p.videoAvailable;
                        this.saveData();
                    }
                },

                getAvailableVideoProfiles() {
                    return this.collections.filter(p => p.videoAvailable && (this.videoCategoryFilter ? p.category === this.videoCategoryFilter : true));
                },

                getVideoRatesForCategory(cat) {
                    if (cat === 'Medium') {
                        return [
                            { duration: '10 Mins', desc: 'Face + Fingering', price: 750 },
                            { duration: '20 Mins', desc: 'Fingering + Mal Out', price: 1020 },
                            { duration: '30 Mins', desc: 'Fingering + Mal Out + Nude Dance', price: 1530 },
                            { duration: '60 Mins', desc: 'Full Bath Service', price: 2040 }
                        ];
                    } else if (cat === 'Premium') {
                        return [
                            { duration: '10 Mins', desc: 'Face + Fingering', price: 915 },
                            { duration: '20 Mins', desc: 'Fingering + Mal Out', price: 1230 },
                            { duration: '30 Mins', desc: 'Fingering + Mal Out + Nude Dance', price: 1750 },
                            { duration: '60 Mins', desc: 'Full Bath Service', price: 2550 }
                        ];
                    } else {
                        return [
                            { duration: '10 Mins', desc: 'Face + Fingering', price: 850 },
                            { duration: '20 Mins', desc: 'Fingering + Mal Out', price: 1125 },
                            { duration: '30 Mins', desc: 'Fingering + Mal Out + Nude Dance', price: 1630 },
                            { duration: '60 Mins', desc: 'Full Bath Service', price: 2250 }
                        ];
                    }
                },

                // COLLECTION PROFILE MODAL HANDLERS
                openCollectionModal() {
                    if (this.collections.length >= 500) {
                        alert('Maximum limit of 500 collection profiles reached.');
                        return;
                    }
                    this.collectionForm = {
                        id: null,
                        name: '',
                        code: '',
                        category: 'Medium',
                        customRatesEnabled: false,
                        rates: { '1 Hour': 2000, '2 Hours': 3200, '3 Hours': 4500, 'Night': 6000 },
                        gallery: []
                    };
                    this.showCollectionModal = true;
                },

                editCollection(p) {
                    this.collectionForm = JSON.parse(JSON.stringify(p));
                    this.showCollectionModal = true;
                },

                deleteCollection(id) {
                    this.collections = this.collections.filter(x => x.id !== id);
                    this.saveData();
                },

                saveCollectionProfile() {
                    if (this.collectionForm.id) {
                        const idx = this.collections.findIndex(x => x.id === this.collectionForm.id);
                        if (idx !== -1) this.collections[idx] = JSON.parse(JSON.stringify(this.collectionForm));
                    } else {
                        const newProf = JSON.parse(JSON.stringify(this.collectionForm));
                        newProf.id = Date.now();
                        newProf.videoAvailable = true;
                        this.collections.push(newProf);
                    }
                    this.saveData();
                    this.showCollectionModal = false;
                },

                handleMultiplePhotosUpload(e) {
                    const files = e.target.files;
                    if (!files) return;
                    for (let i = 0; i < Math.min(files.length, 5); i++) {
                        const reader = new FileReader();
                        reader.onload = (evt) => {
                            if (this.collectionForm.gallery.length < 5) {
                                this.collectionForm.gallery.push(evt.target.result);
                            }
                        };
                        reader.readAsDataURL(files[i]);
                    }
                },

                handleFileUpload(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (evt) => {
                            this.paymentForm.proofImage = evt.target.result;
                        };
                        reader.readAsDataURL(file);
                    }
                },

                // UTILS
                openGalleryModal(profile) {
                    this.selectedGalleryProfile = profile;
                    this.galleryActiveIndex = 0;
                    this.showGalleryModal = true;
                },

                prevPhoto() {
                    if (!this.selectedGalleryProfile) return;
                    const total = this.selectedGalleryProfile.gallery.length;
                    this.galleryActiveIndex = (this.galleryActiveIndex - 1 + total) % total;
                },

                nextPhoto() {
                    if (!this.selectedGalleryProfile) return;
                    const total = this.selectedGalleryProfile.gallery.length;
                    this.galleryActiveIndex = (this.galleryActiveIndex + 1) % total;
                },

                copyToClipboard(text) {
                    navigator.clipboard.writeText(text);
                    alert('Copied to clipboard: ' + text);
                },

                savePaymentNumbers() {
                    this.saveData();
                    alert('Gateway Payment Numbers Updated.');
                },

                getSubAreasForMain(mainId) {
                    return this.allSubAreas.filter(s => s.mainAreaId === mainId);
                },

                openAddMainAreaModal() {
                    const name = prompt('Enter Main Area Name:');
                    if (name) {
                        const id = name.toLowerCase().replace(/\s+/g, '_');
                        this.mainAreas.push({ id, name });
                    }
                },

                openAddSubAreaModal() {
                    const name = prompt('Enter Sub-Area Name:');
                    if (name) {
                        const type = prompt('Enter Place Type (Flat / Hotel / Both):', 'Hotel') || 'Hotel';
                        const mainAreaId = this.mainAreas[0].id;
                        this.allSubAreas.push({
                            id: 'sub_' + Date.now(),
                            mainAreaId,
                            mainAreaName: this.mainAreas[0].name,
                            name,
                            type
                        });
                        this.onRealMainAreaChange();
                    }
                },

                deleteMainArea(id) {
                    this.mainAreas = this.mainAreas.filter(m => m.id !== id);
                    this.allSubAreas = this.allSubAreas.filter(s => s.mainAreaId !== id);
                },

                deleteSubArea(id) {
                    this.allSubAreas = this.allSubAreas.filter(s => s.id !== id);
                    this.onRealMainAreaChange();
                },

                addCustomService() {
                    if (this.customServices.length < 10) {
                        this.customServices.push({ title: 'New Service Item', price: 1000 });
                    } else {
                        alert('Maximum 10 custom service items allowed.');
                    }
                },

                removeCustomService(idx) {
                    this.customServices.splice(idx, 1);
                }
            };
        }
    </script>
</body>
